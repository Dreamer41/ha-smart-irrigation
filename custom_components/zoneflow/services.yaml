# All four services below are domain-level (not entity-platform) services.
# With only one ZoneFlow zone configured, targeting is optional -- the
# single zone is used automatically. With two or more zones, pass one
# zone's device_id (or one of its entity_ids) so the call goes to the
# intended zone; calling without either when 2+ zones exist is a clear
# error rather than a silent guess (see __init__.py's _resolve_controller).
run_deep_soak:
  name: Run Deep Soak
  description: >-
    Runs the deep-soak cycle now if (and only if) the same gates the 05:00
    schedule uses are satisfied (mutex free, 14-day interval + dry-down met,
    14-day rain ceiling not exceeded). Identical code path to the scheduled
    run.
  fields:
    device_id:
      name: Zone Device
      description: The zone's device. Only needed with 2+ zones configured.
      selector:
        device:
          integration: zoneflow
          multiple: true
    entity_id:
      name: Zone Entity
      description: Any entity belonging to the zone's device (alternative to Zone Device).
      selector:
        entity:
          integration: zoneflow
          multiple: true

run_routine_irrigation:
  name: Run Routine Irrigation
  description: >-
    Runs the routine irrigation cycle now if (and only if) the same gates
    the 05:30 schedule uses are satisfied. Identical code path to the
    scheduled run.
  fields:
    device_id:
      name: Zone Device
      description: The zone's device. Only needed with 2+ zones configured.
      selector:
        device:
          integration: zoneflow
          multiple: true
    entity_id:
      name: Zone Entity
      description: Any entity belonging to the zone's device (alternative to Zone Device).
      selector:
        entity:
          integration: zoneflow
          multiple: true

reset_lock:
  name: Reset Irrigation Lock
  description: Force-clears the mutex lock and abort flag. Emergency use only.
  fields:
    device_id:
      name: Zone Device
      description: The zone's device. Only needed with 2+ zones configured.
      selector:
        device:
          integration: zoneflow
          multiple: true
    entity_id:
      name: Zone Entity
      description: Any entity belonging to the zone's device (alternative to Zone Device).
      selector:
        entity:
          integration: zoneflow
          multiple: true

snooze_today:
  name: Snooze Today
  description: >-
    Skips whichever of this zone's scheduled cycles (deep soak, routine, or
    both) hasn't already run today, without changing any other setting.
    Normal scheduling resumes automatically starting tomorrow.
  fields:
    device_id:
      name: Zone Device
      description: The zone's device. Only needed with 2+ zones configured.
      selector:
        device:
          integration: zoneflow
          multiple: true
    entity_id:
      name: Zone Entity
      description: Any entity belonging to the zone's device (alternative to Zone Device).
      selector:
        entity:
          integration: zoneflow
          multiple: true

test_pulse:
  name: Test Pulse
  description: >-
    Bypasses every schedule/dry-down/rain gate and runs one short valve
    pulse, for bench-testing the valve/pump wiring before trusting the real
    schedule. Still respects the mutex lock and safety watchdogs.
  fields:
    device_id:
      name: Zone Device
      description: The zone's device. Only needed with 2+ zones configured.
      selector:
        device:
          integration: zoneflow
          multiple: true
    entity_id:
      name: Zone Entity
      description: Any entity belonging to the zone's device (alternative to Zone Device).
      selector:
        entity:
          integration: zoneflow
          multiple: true
    seconds:
      name: Seconds
      description: Pulse duration in seconds (1-120).
      default: 10
      selector:
        number:
          min: 1
          max: 120
          unit_of_measurement: s
