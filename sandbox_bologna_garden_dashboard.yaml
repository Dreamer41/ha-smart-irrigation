views:
- title: Chilis
  path: chilis
  icon: mdi:chili-hot
  cards:
  - type: heading
    heading: Chilis
    heading_style: title
    icon: mdi:chili-hot
  - type: entities
    title: Status
    show_header_toggle: false
    entities:
    - entity: switch.simulated_valve_chilis
      name: Valve
    - entity: binary_sensor.chilis_irrigation_in_progress
      name: Lock (In Progress)
    - entity: binary_sensor.chilis_irrigation_abort_flag
      name: Abort Flag
    - entity: sensor.simulated_pump_power_olive_chili
      name: Pump Power (shared with Olive Trees)
    - entity: sensor.chilis_last_cycle_water_delivered_measured
      name: Last Cycle Water Delivered
    - entity: sensor.chilis_next_irrigation_estimate
      name: Next Run Estimate
  - type: entities
    title: Manual Controls
    show_header_toggle: false
    entities:
    - entity: switch.chilis_deep_soak_enabled
      name: Deep Soak Enabled
    - type: buttons
      entities:
      - entity: button.chilis_run_deep_soak_now
        name: Run Deep Soak
        icon: mdi:waves
      - entity: button.chilis_run_routine_irrigation_now
        name: Run Routine
        icon: mdi:play
      - entity: button.chilis_reset_irrigation_lock
        name: Reset Lock
        icon: mdi:lock-open-variant
  - type: entities
    title: Site & Growth Profile
    show_header_toggle: false
    entities:
    - entity: sensor.chilis_soil_profile
    - entity: sensor.chilis_growth_stage_ramp
    - entity: datetime.chilis_planting_transplant_date
  - type: entities
    title: Routine Irrigation
    show_header_toggle: false
    entities:
    - entity: number.chilis_routine_normal_weekly_target
    - entity: number.chilis_routine_hot_weekly_target
    - entity: number.chilis_hot_weather_temp_threshold
    - entity: number.chilis_routine_cool_weekly_target
    - entity: number.chilis_cool_weather_temp_threshold
    - entity: number.chilis_routine_dry_down_holdoff
    - entity: number.chilis_routine_pulse_count_split_cycle
    - entity: number.chilis_routine_soak_interval_between_pulses
  - type: entities
    title: Deep Soak (14-Day)
    show_header_toggle: false
    entities:
    - entity: number.chilis_deep_soak_target_depth
    - entity: number.chilis_deep_soak_rain_ceiling_14d
    - entity: number.chilis_deep_soak_subsoil_dry_down_holdoff
    - entity: number.chilis_deep_soak_pulse_count_split_cycle
    - entity: number.chilis_deep_soak_soak_interval_between_pulses
  - type: entities
    title: Forecast Gate & Dry-Spell Override
    show_header_toggle: false
    entities:
    - entity: number.chilis_forecast_rain_skip_threshold
    - entity: number.chilis_forecast_rain_probability_threshold
    - entity: number.chilis_forecast_dry_spell_override
  - type: entities
    title: Calibration & Safety Caps
    show_header_toggle: false
    entities:
    - entity: number.chilis_emitter_flow_rate_calibration
    - entity: number.chilis_rain_gauge_mm_per_tip_calibration
    - entity: number.chilis_pump_low_power_warning_threshold
    - entity: number.chilis_deep_soak_max_safety_runtime_cap
    - entity: number.chilis_routine_max_safety_runtime_cap
    - entity: number.chilis_max_daily_irrigation_runtime_safety_cap
  - type: entities
    title: History Seeding
    show_header_toggle: false
    entities:
    - entity: datetime.chilis_last_routine_irrigation
    - entity: datetime.chilis_last_deep_soak
    - entity: datetime.chilis_last_significant_rain
  - type: markdown
    title: Zone Trigger Log
    content: '{% set lock = states(''binary_sensor.chilis_irrigation_in_progress'') %}

      {% set abort = states(''binary_sensor.chilis_irrigation_abort_flag'') %}

      {% set routine_ts = states(''datetime.chilis_last_routine_irrigation'') %}

      {% set deep_soak_ts = states(''datetime.chilis_last_deep_soak'') %}

      | Field | Value |

      | :--- | :--- |

      | **Lock (In Progress)** | {{ ''RUNNING'' if lock == ''on'' else ''idle'' }} |

      | **Abort Flag** | {{ ''PROBLEM'' if abort == ''on'' else ''OK'' }} |

      {% if routine_ts not in [''unknown'', ''unavailable'', none] %}

      | **Last Routine Irrigation** | {{ as_timestamp(routine_ts) | timestamp_custom(''%b %d, %H:%M'')
      }} |

      {% endif %}

      {% if deep_soak_ts not in [''unknown'', ''unavailable'', none] %}

      | **Last Deep Soak** | {{ as_timestamp(deep_soak_ts) | timestamp_custom(''%b %d, %H:%M'') }} |

      {% endif %}

      '
