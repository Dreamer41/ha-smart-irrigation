default_config:

# --- Simulated hardware for testing the ZoneFlow Irrigation integration ---
# Nothing below touches your real Home Assistant or the real valve/pump.
# Each of these is a slider, counter, or toggle you control by hand from
# this sandbox's own dashboard to fake rain, sun, and pump behavior.

input_number:
  fake_pump_power:
    name: "Simulated Pump Power"
    min: 0
    max: 1500
    step: 10
    unit_of_measurement: "W"
    icon: mdi:flash

  fake_outdoor_temp:
    name: "Simulated Outdoor Temperature"
    min: -10
    max: 50
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:thermometer

counter:
  fake_rain_tips:
    name: "Simulated Rain Gauge Tips"
    icon: mdi:weather-pouring

input_boolean:
  fake_valve_state:
    name: "Simulated Valve (internal, don't add to dashboard)"

# Modern template syntax (the old `platform: template` under sensor:/switch:
# was removed by Home Assistant -- this is the current replacement).
template:
  - switch:
      - name: "Simulated Watering Valve"
        unique_id: zoneflow_sandbox_watering1
        state: "{{ is_state('input_boolean.fake_valve_state', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.fake_valve_state
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.fake_valve_state

  - sensor:
      - name: "Simulated Water Pump Power"
        unique_id: zoneflow_sandbox_pump_power
        unit_of_measurement: "W"
        state: "{{ states('input_number.fake_pump_power') }}"

      - name: "Simulated Outdoor Temperature"
        unique_id: zoneflow_sandbox_outdoor_temp
        unit_of_measurement: "°C"
        device_class: temperature
        state: "{{ states('input_number.fake_outdoor_temp') }}"
